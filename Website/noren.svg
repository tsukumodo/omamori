<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-labelledby="noren-title">
  <title id="noren-title">暖簾の下端（3本の切れ込み）</title>
  <!-- 横幅可変。上端 y=0〜55 は棒に掛かる布として必ず地続き（切れ込みなし、布全体の55%）。
       その下 y=55〜100 で3本のスリットが4枚の裾に分け（布全体の45%まで切れ込み）、各裾はゆるい丸みで垂れる -->
  <path fill="currentColor" d="
    M0 0 L300 0 L300 55 L0 55 Z
    M0 55 L70.5 55 L70.5 80.2 Q35.25 100 0 80.2 Z
    M76.5 55 L147 55 L147 80.2 Q111.75 100 76.5 80.2 Z
    M153 55 L223.5 55 L223.5 80.2 Q188.25 100 153 80.2 Z
    M229.5 55 L300 55 L300 80.2 Q264.75 100 229.5 80.2 Z
  "/>
</svg>
