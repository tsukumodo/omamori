<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 100" preserveAspectRatio="none" role="img" aria-labelledby="noren-title">
  <title id="noren-title">暖簾の下端（1タイル分）</title>
  <!-- 1タイル = 布1枚(幅80) + 隙間1本(幅12)。CSS側で mask-size を実px指定し
       mask-repeat: repeat-x でこれを敷き詰める。ビューポート幅に関わらず
       隙間の実寸が一定になる（3-1。以前は mask-size:100% 100% で1枚絵を
       引き伸ばしていたため、幅が広いほど隙間が太ってしまっていた）。
       上端 y=0〜55 は棒に掛かる布として必ず地続き（切れ込みなし、布全体の55%）。
       その下 y=55〜100 で1本のスリット分だけ裾を切り離し、ゆるい丸みで垂れる。 -->
  <path fill="currentColor" d="
    M0 0 L92 0 L92 55 L0 55 Z
    M0 55 L80 55 L80 80.2 Q40 100 0 80.2 Z
  "/>
</svg>
