name: Build Repo Listing

env:
  listPublishDirectory: Website
  pathToCi: ci
  
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Release]
    types:
      - completed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  
# 同時デプロイは1つに制限する。ただし進行中のデプロイはキャンセルしない。
# GitHub 公式の Pages スターターワークフローも cancel-in-progress: false を使っている。
# true にすると、Build Release 直後の自動発火と手動実行が重なったときに
# 後発が本番デプロイを途中で殺してしまい、リスティングが古いまま残る
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  
  # Build the VPM Listing Website and deploy to GitHub Pages
  build-listing:
    name: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      
      # Checkout Local Repository
      - name: Checkout Local Repository
        uses: actions/checkout@v7

      # Checkout Automation Repository without removing prior checkouts
      - name: Checkout Automation Repository
        uses: actions/checkout@v7
        with:
          repository: vrchat-community/package-list-action
          path: ${{ env.pathToCi }}
          clean: false

      # Load cached data from previous runs
      - name: Restore Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.pathToCi }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}
      
      # Build Package Version Listing with Nuke
      - name: Build Package Version Listing
        run: ${{ env.pathToCi }}/build.cmd BuildRepoListing --root ${{ env.pathToCi }} --list-publish-directory $GITHUB_WORKSPACE/${{ env.listPublishDirectory }} --current-package-name ${{ vars.PACKAGE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Prepare for GitHub Pages deployment
      - name: Setup Pages
        uses: actions/configure-pages@v6
      
      # Upload the VPM Listing Website to GitHub Pages artifacts
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.listPublishDirectory }}
      
      # Deploy the uploaded VPM Listing Website to GitHub Pages
      # ⚠ deploy-pages v5 の timeout は最大 600000ms（10分）に切り詰められる。
      #    超過値を渡しても「timeout set to the maximum」警告が出るだけで延長効果はない
      #    （2026-08-06 の Pages 逼迫時に 5時間50分を指定して実測確認）。
      #    バックエンド逼迫でここが10分を超えて詰まる場合、「待つ」対処は不可能なので
      #    ワークフローの再実行を反復して拾うこと。経緯は decisions/decision-log.md の DEC-076
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5